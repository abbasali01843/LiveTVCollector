name: TV-Indonesia Update Files

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Run TV-Indonesia collector
        run: python BugsfreeMain/TV-Indonesia.py
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add LiveTV/Indonesia/LiveTV.m3u LiveTV/Indonesia/LiveTV.txt LiveTV/Indonesia/LiveTV.json LiveTV/Indonesia/LiveTV
          git commit -m "TV-Indonesia Update files - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git pull --rebase origin main
          git push
