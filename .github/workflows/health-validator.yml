name: Unified Stream Health

on:
  schedule:
    - cron: '30 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Validate generated streams
        run: python BugsfreeStreams/validator.py

      - name: Commit health report
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add BugsfreeStreams/Output/health.json
          git commit -m "Update unified stream health report" || echo "No health report changes"
          git push
