name: Unified Stream Health

on:
  schedule:
    - cron: '30 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Reset generated health output
        run: rm -rf BugsfreeStreams/Output

      - name: Validate generated streams
        run: python BugsfreeStreams/validator.py

      - name: Generate collection indexes
        run: python generate_indexes.py

      - name: Commit health and indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BugsfreeStreams/Output/ LiveTV/index.json Movies/index.json
          git diff --cached --quiet || git commit -m "Update unified health and collection indexes"
          git push
