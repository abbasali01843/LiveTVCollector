name: TV-USA Update Files

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run TV-USA collector
        run: python BugsfreeMain/TV-USA.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add LiveTV/USA/LiveTV.m3u LiveTV/USA/LiveTV.txt LiveTV/USA/LiveTV.json LiveTV/USA/LiveTV
          git commit -m "Update USA live TV" || echo "No changes to commit"
          git pull --rebase origin main
          git push
