name: TV-Mexico Update Files

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collector-main
  cancel-in-progress: false
jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests
      - run: python BugsfreeMain/TV-Mexico.py
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add LiveTV/Mexico/LiveTV.m3u LiveTV/Mexico/LiveTV.txt LiveTV/Mexico/LiveTV.json LiveTV/Mexico/LiveTV
          git commit -m "TV-Mexico Update files - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git pull --rebase origin main
          git push
