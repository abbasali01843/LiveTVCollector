name: TV-Egypt Update Files

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests
      - run: python BugsfreeMain/TV-Egypt.py
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add LiveTV/Egypt/LiveTV.m3u LiveTV/Egypt/LiveTV.txt LiveTV/Egypt/LiveTV.json LiveTV/Egypt/LiveTV
          git commit -m "Update Egypt TV files" || exit 0
          git push
