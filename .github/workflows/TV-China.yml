name: TV-China Update Files

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run TV-China collector
        run: python BugsfreeMain/TV-China.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add LiveTV/China/LiveTV.m3u LiveTV/China/LiveTV.txt LiveTV/China/LiveTV.json LiveTV/China/LiveTV
          git diff --cached --quiet || git commit -m "TV-China update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin main
          git push
