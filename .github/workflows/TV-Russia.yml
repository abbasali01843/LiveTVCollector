name: TV-Russia Update Files

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Run collector
        run: python BugsfreeMain/TV-Russia.py
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add LiveTV/Russia/LiveTV.m3u LiveTV/Russia/LiveTV.txt LiveTV/Russia/LiveTV.json LiveTV/Russia/LiveTV
          git commit -m "Update Russia TV files" || exit 0
          git push
