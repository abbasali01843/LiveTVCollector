name: TV-Venezuela Update Files

on:
  schedule:
    - cron: '27 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-main
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Run collector
        run: python BugsfreeMain/TV-Venezuela.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LiveTV/Venezuela/LiveTV.m3u LiveTV/Venezuela/LiveTV.txt LiveTV/Venezuela/LiveTV.json LiveTV/Venezuela/LiveTV
          git diff --cached --quiet || git commit -m "Update Venezuela TV files"
          git pull --rebase origin main
          git push
