name: Stream Checker-PK (Legacy)

# Deprecated: unified stream health now runs from health-validator.yml.
# Kept as manual-only for emergency compatibility with the old processor.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests
      - run: python BugsfreeStreams/process_streams-PK.py
      - name: Commit legacy output if explicitly requested
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BugsfreeStreams/
          git diff --cached --quiet || git commit -m "Update legacy PK stream output"
          git pull --rebase origin main
          git push
