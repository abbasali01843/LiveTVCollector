# Configuration for SpecialCollection.
#
# IMPORTANT: source URLs must not be stored in this tracked file.
# Supply them through the GitHub Actions secret SPECIAL_M3U_URLS as a
# newline- or comma-separated list of public/legal M3U/M3U8/JSON URLs.
settings:
  concurrency: 24
  fetchTimeout: 8000
  linkCheckTimeout: 5000
  batchSize: 100
  outputDirPrefix: SpecialLinks
  channelsPerFile: 2000

urls: []
